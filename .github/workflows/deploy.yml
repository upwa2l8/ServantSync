name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'Components/**'
      - 'Data/**'
      - 'Models/**'
      - 'Services/**'
      - 'Properties/**'
      - 'wwwroot/**'
      - 'Program.cs'
      - 'Dockerfile'
      - '.dockerignore'
      - '*.csproj'
      - '*.sln'
      - 'appsettings.json'
      - 'appsettings.*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you redeploying? (audit trail comment only)'
        required: false
        default: 'Manual'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & deploy to Azure Container Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/servantsync:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/servantsync:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        env:
          IMAGE_TAG: ${{ secrets.ACR_NAME }}.azurecr.io/servantsync:${{ github.sha }}
        with:
          azcliversion: latest
          inlineScript: |
            sed 's|PLACEHOLDER-OVERRIDDEN-BY-IMAGE-TO-DEPLOY-DO-NOT-RUN|'"$IMAGE_TAG"'|g' \
              deploy/aca.servantsync.yaml > /tmp/aca.rendered.yaml
            az containerapp update \
              --name "${{ secrets.ACA_NAME }}" \
              --resource-group "${{ secrets.AZURE_RG }}" \
              --yaml /tmp/aca.rendered.yaml \
              --output none
            for i in $(seq 1 30); do
              STATE=$(az containerapp show \
                --name "${{ secrets.ACA_NAME }}" \
                --resource-group "${{ secrets.AZURE_RG }}" \
                --query properties.provisioningState -o tsv)
              if [ "$STATE" = "Succeeded" ]; then
                echo "provisioningState=Succeeded after $((i*10))s ok"
                exit 0
              fi
              if [ "$STATE" = "Failed" ] || [ "$STATE" = "Error" ]; then
                echo "provisioningState=$STATE after $((i*10))s -- aborting"
                exit 1
              fi
              sleep 10
            done
            echo "TIMEOUT: provisioningState did not reach Succeeded in 5 min"
            exit 1

      - name: Smoke-check (optional)
        env:
          SMOKE_CHECK_URL: ${{ secrets.SMOKE_CHECK_URL }}
        run: |
          if [ -n "$SMOKE_CHECK_URL" ]; then
            curl --fail --silent --show-error --max-time 30 \
              "$SMOKE_CHECK_URL" > /dev/null
            echo "Smoke check OK"
          else
            echo "SMOKE_CHECK_URL not set; skipping smoke check."
          fi
